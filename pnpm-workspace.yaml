# pnpm 12 reads its settings here; the "pnpm" field in package.json is ignored (spike gotcha 2).
overrides:
  # The 4.0.3 satellites peer on an unpublished effect 4.0.3 and crash at runtime (spike gotcha 1).
  '@effect/platform-node-shared': 4.0.2
allowBuilds:
  esbuild: true
  lightningcss: true
minimumReleaseAgeExclude:
  - '@tanstack/react-start-rsc@0.1.63'
  - '@tanstack/react-start-server@1.167.50'
  - '@tanstack/react-start@1.169.2'
  - '@tanstack/router-generator@1.167.44'
  - '@tanstack/router-plugin@1.168.46'
  - '@tanstack/router-utils@1.162.4'
  - '@tanstack/start-plugin-core@1.171.53'
  - '@tanstack/start-server-core@1.169.43'
